        // --- HAQIQIY FALSAFA SAVOLLARI BAZASI (PDFdan olingan matnlar) ---
        const realPhilosophyQuestions = [

            { q: "Falsafaning ontologiya bo'limida qanday masalalar oʻrganiladi?", o: ["#Borliq va mavjudlik mohiyati", "Yer osti tabiiy boyliklarini aniqlash", "Kimyoviy elementlar va moddalar", "Shaxsiy tajribalar va hislar"] },
            { q: "Falsafa va dinning umumiy maqsadi nima?", o: ["#Olam va insonning mohiyatini anglash", "Olamning kosmologik modelini yaratish", "Mehnat haqida nazariyalar yaratish", "Tajriba va eksperimentlarga asoslanish"] },
            { q: "Falsafiy bilimlarning muhim tarkibiy qismlaridan biri nima?", o: ["#Gnoseologiya", "Fizika", "Kimyo", "Shaxsiy e'tiqodlar"] },

            { q: "Falsafaning ijtimoiy sohaga ta'siri qanday namoyon bo'ladi?", o: ["#Jamiyatni boshqarishdagi qarashlarni shakllantirish orqali", "Faqat axloqiy qadriyatlarni o'rgatishda", "Tabiiy hodisalarni tushuntirishda", "Ilmiy haqiqatlarni targ'ib qilishda"] },
            { q: "Falsafiy dunyoqarashning eng muhim vazifasi nima?", o: ["#Insonning o'zini va borliqni anglashiga yordam berish", "Ilmiy ma'lumotlarni to'plash", "Jamiyatni iqtisodiy isloh qilish", "Diniy qoidalarni kuchaytirish"] },
            { q: "Jamiyat qanday tizim sifatida qaraladi?", o: ["#Rivojlanuvchi va oʻzgaruvchan tizim", "Biologik evolyutsion birlik", "Statik ijtimoiy guruh", "Faqatgina iqtisodiy tuzilma"] },

            { q: "Qaysi jamiyat toʻliqsiz hisoblanadi?", o: ["#Bir oila, qishloq yoki ovul", "Shahar yoki milliy birlik", "Xalqaro sivilizatsiya", "Umumiy madaniy jamiyat"] },
            { q: "Jamiyatning paydo bo'lishi qanday omillarga asoslanadi?", o: ["#Mehnat va muloqotga", "Tasodifiy voqealarning birlashuviga", "Biologik evolyutsiya natijasiga", "Tabiiy resurslarning mavjudligiga"] },
            { q: "Forobiyning fikriga koʻra, to'liq jamiyatning birinchi bosqichi nima?", o: ["#Shahar jamiyati", "Oila", "Milliy birlik", "Qishloq"] },
            { q: "P.A.Sorokin jamiyatni qanday tizim sifatida tasvirlagan?", o: ["#Gorizontal, vertikal va fluktuatsion tizimlar", "Ijtimoiy-siyosiy yopiq tizimlar", "Faqat iqtisodiy tuzilma", "Etnik guruhlar yig'indisi"] },
            { q: "Gnoseologiya nima?", o: ["#Bilish haqidagi ta'limot", "Matematik nazariya", "Falsafiy eksperiment usuli", "Mantiqiy yondashuv"] },
            { q: "Epistemologiyaning asosiy oʻrganish ob'yekti nima?", o: ["#Haqiqiy ilmiy bilimlarning mazmuni", "Axloqiy qoidalar tizimi", "San'at nazariyasi va turlari", "Iqtisodiy munosabatlar"] },
            { q: "David Yumning bilish haqidagi yondashuvi qanday nomlanadi?", o: ["#Skeptitsizm", "Agnostitsizm", "Optimizm", "Materializm"] },
            { q: "Kantning 'narsa oʻzida' konsepsiyasi nimani anglatadi?", o: ["#Hissiyot va tafakkurga bog'liq bo'lmagan borliqni", "Biz bevosita biladigan barcha narsalarni", "Ilmiy tadqiyod ob'yektini", "Sub'yektiv aqlni"] },
            { q: "Empirizmga ko'ra haqiqiy bilimning asosi nimada?", o: ["#Tajriba", "Aql", "E'tiqod", "Mifologik g'oyalar"] },
            { q: "Noilmiy bilimning eng birinchi shakli nima?", o: ["#Kundalik amaliy bilim", "Fizikaviy bilim", "Kimyoviy bilim", "Radikal falsafiy qarashlar"] },
            { q: "Relyativizm nima?", o: ["#Haqiqat nisbiy va vaqtinchalikdir", "Haqiqat mutlaq va oʻzgarmasdir", "Haqiqatning ilmiy asosi yo'qdir", "Haqiqat shaxsiy e'tiqodga asoslanadi"] },
            { q: "Badiiy bilimning oʻziga xos xususiyati nimada?", o: ["#Borliqni obrazlar orqali aks ettirishda", "Matematik formulalarda izohlashda", "Nazariy ma'lumotlarni ifodalashda", "Haqiqatning mutlaq tahlilida"] },
            { q: "Ontologiya atamasi qaysi so'zdan olingan?", o: ["#Yunoncha «ontos» - borliq, «logos» - ta'limot", "Lotincha «onto» - tiriklik", "Arabcha «vujud» - mavjudlik", "Nemischa «sein» - borliq"] },
            { q: "«Hamma narsa sondir» degan fikr kimga tegishli?", o: ["#Pifagor", "Fales", "Anaksimandr", "Ksenofan"] },
            { q: "«Oqayotgan suvga ikki marta tushib bo’lmaydi» fikr muallifi kim?", o: ["#Geraklit", "Fales", "Anaksimandr", "Ksenofan"] },
            { q: "Ibn Sino fikricha, «Vujudi vojib» nima?", o: ["#Alloh (Yaratuvchi)", "Inson", "Koinot", "Vaqt va makon"] },
            { q: "Monizm ta’limotiga to‘g‘ri ta’rif berilgan qatorni ko‘rsating?", o: ["#Olamning asosi yagona substansiyadan iborat deb hisoblovchi ta'limot", "Olam ikkita teng asosga ega degan ta'limot", "Olamda juda ko'p mustaqil kuchlar mavjudligi", "Olamni inkor etuvchi qarash"] }
        ];

        // 10 guruh uchun 50 tadan jami 500 ta savol hosil qiluvchi generator
        const generateGroups = () => {
            const groups = [];
            for (let i = 0; i < 10; i++) {
                const groupQuestions = [];
                for (let j = 0; j < 50; j++) {
                    const baseQ = realPhilosophyQuestions[j % realPhilosophyQuestions.length];
                    const parsedOptions = baseQ.o.map(opt => ({
                        text: opt.replace('#', ''),
                        isCorrect: opt.startsWith('#')
                    })).sort(() => Math.random() - 0.5); 
                    
                    groupQuestions.push({
                        id: `g${i}_q${j}`,
                        text: `${j + 1}. ${baseQ.q}`,
                        options: parsedOptions
                    });
                }
                groups.push({
                    id: i,
                    title: `${i + 1} - Guruh`,
                    description: `${i * 50 + 1} dan ${(i + 1) * 50} gacha bo'lgan testlar`,
                    questions: groupQuestions
                });
            }
            return groups;
        };

        const GROUPS = generateGroups();

        // --- CUSTOM INLINE SVG NEON ICONS ---
        const Icons = {
            Clock: () => (
                <svg className="w-8 h-8 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                    <circle cx="12" cy="12" r="10" />
                    <polyline points="12 6 12 12 16 14" />
                </svg>
            ),
            Trophy: () => (
                <svg className="w-7 h-7 text-yellow-400 animate-pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                    <path d="M6 9H4.5a2.5 2.5 0 010-5H6M18 9h1.5a2.5 2.5 0 000-5H18M4 22h16M10 14.66V17c0 .55-.45 1-1 1H4v2h16v-2h-5c-.55 0-1-.45-1-1v-2.34M12 2a4 4 0 00-4 4v5a4 4 0 008 0V6a4 4 0 00-4-4z" />
                </svg>
            ),
            Users: () => (
                <svg className="w-6 h-6 text-pink-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                    <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8zm14 10v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75" />
                </svg>
            ),
            Power: () => (
                <svg className="w-5 h-5 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5">
                    <path d="M18.36 6.64a9 9 0 11-12.73 0M12 2v10" />
                </svg>
            ),
            UserSingle: () => (
                <svg className="w-8 h-8 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                    <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 11a4 4 0 100-8 4 4 0 000 8z" />
                </svg>
            ),
            Play: () => (
                <svg className="w-6 h-6 text-green-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                    <polygon points="5 3 19 12 5 21 5 3" />
                </svg>
            ),
            LogIn: () => (
                <svg className="w-6 h-6 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                    <path d="M15 3H7a2 2 0 00-2 2v14a2 2 0 002 2h8M10 17l5-5-5-5M15 12H3" />
                </svg>
            ),
            ArrowLeft: () => (
                <svg className="w-5 h-5 text-slate-300 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5">
                    <line x1="19" y1="12" x2="5" y2="12" />
                    <polyline points="12 19 5 12 12 5" />
                </svg>
            ),
            Home: () => (
                <svg className="w-5 h-5 text-cyan-400 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
                    <polyline points="9 22 9 12 15 12 15 22" />
                </svg>
            ),
            Settings: () => (
                <svg className="w-6 h-6 text-slate-400 hover:text-cyan-400 transition-colors cursor-pointer" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                    <circle cx="12" cy="12" r="3" />
                    <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" />
                </svg>
            )
        };

        // --- NEON BUTTON ---
        const NeonButton = ({ children, onClick, color = 'cyan', className = '', disabled = false }) => {
            const colors = {
                cyan: 'border-cyan-400 text-cyan-400 hover:bg-cyan-400 hover:text-gray-950 shadow-[0_0_10px_rgba(34,211,238,0.2)] hover:shadow-[0_0_20px_rgba(34,211,238,0.7)]',
                pink: 'border-pink-500 text-pink-500 hover:bg-pink-500 hover:text-gray-950 shadow-[0_0_10px_rgba(236,72,153,0.2)] hover:shadow-[0_0_20px_rgba(236,72,153,0.7)]',
                green: 'border-green-400 text-green-400 hover:bg-green-400 hover:text-gray-950 shadow-[0_0_10px_rgba(74,222,128,0.2)] hover:shadow-[0_0_20px_rgba(74,222,128,0.7)]',
                red: 'border-red-500 text-red-500 hover:bg-red-500 hover:text-gray-950 shadow-[0_0_10px_rgba(239,68,68,0.2)] hover:shadow-[0_0_20px_rgba(239,68,68,0.7)]',
            };

            return (
                <button
                    onClick={onClick}
                    disabled={disabled}
                    className={`border-2 px-6 py-3 rounded-xl font-extrabold tracking-wider transition-all duration-300 disabled:opacity-40 disabled:cursor-not-allowed flex items-center justify-center ${colors[color]} ${className}`}
                >
                    {children}
                </button>
            );
        };

        const NeonInput = ({ value, onChange, placeholder, type = 'text', maxLength, className = "" }) => (
            <input
                type={type}
                value={value}
                onChange={onChange}
                placeholder={placeholder}
                maxLength={maxLength}
                className={`w-full bg-slate-900/60 border-2 border-cyan-500/50 rounded-xl px-4 py-3 text-cyan-50 focus:outline-none focus:border-cyan-400 focus:shadow-[0_0_15px_rgba(34,211,238,0.5)] transition-all text-center text-xl font-bold tracking-widest placeholder:text-cyan-850 ${className}`}
            />
        );

        // --- MAIN APP COMPONENT ---
        function App() {
            const [fb, setFb] = useState(null);
            const [user, setUser] = useState(null);
            const [view, setView] = useState('home'); 
            const [selectedGroup, setSelectedGroup] = useState(null);
            const [mode, setMode] = useState(null); // 'solo' | 'multi' | 'simulation'
            const [playerName, setPlayerName] = useState('');
            const [roomCode, setRoomCode] = useState('');
            const [joinCode, setJoinCode] = useState('');
            
            // Real Firebase or Simulated State
            const [roomData, setRoomData] = useState(null);
            const [currentQIndex, setCurrentQIndex] = useState(0);
            const [timeLeft, setTimeLeft] = useState(20);
            const [localAnswers, setLocalAnswers] = useState({}); 
            const [isTransitioning, setIsTransitioning] = useState(false);
            
            // Custom Modals
            const [modal, setModal] = useState({ show: false, title: "", message: "", type: "cyan" });
            const [showSettings, setShowSettings] = useState(false);
            const [configInput, setConfigInput] = useState("");

            const timerRef = useRef(null);
            const simulationBotsTimerRef = useRef([]);
            const isHost = mode === 'simulation' || roomData?.hostId === user?.uid;

            // SAFELY DECLARE PLAYING-VIEW DEPENDENT VARIABLES
            const question = (selectedGroup && selectedGroup.questions && selectedGroup.questions[currentQIndex]) 
                ? selectedGroup.questions[currentQIndex] 
                : null;
            const myAnswer = (selectedGroup) 
                ? (mode === 'solo' 
                    ? localAnswers[currentQIndex] 
                    : roomData?.players?.[mode === 'simulation' ? 'user-player' : user?.uid]?.answers?.[currentQIndex]) 
                : undefined;
            const hasAnswered = myAnswer !== undefined;
            const playersList = (roomData && roomData.players) 
                ? Object.values(roomData.players).sort((a, b) => (b.score || 0) - (a.score || 0)) 
                : [];

            const triggerModal = (title, message, type = "pink") => {
                setModal({ show: true, title, message, type });
            };

            // --- HOISTED GAME FUNCTIONS (Declared before useEffect hooks to avoid ReferenceError TDZ) ---
            
            const quit = () => {
                setView('home');
                setRoomCode('');
                setMode(null);
                setLocalAnswers({});
                setRoomData(null);
                setCurrentQIndex(0);
                setIsTransitioning(false);
            };

            const startSolo = () => {
                if (!playerName.trim()) return triggerModal("Ogohlantirish", "Iltimos, ismingizni kiriting!");
                setMode('solo');
                setLocalAnswers({});
                setCurrentQIndex(0);
                setView('playing');
            };

            const handleAnswerSolo = (optIndex) => {
                if (localAnswers[currentQIndex] !== undefined) return; 
                setLocalAnswers(prev => ({ ...prev, [currentQIndex]: optIndex }));
            };

            const handleNextQuestionSolo = () => {
                if (currentQIndex < selectedGroup.questions.length - 1) {
                    setCurrentQIndex(prev => prev + 1);
                } else {
                    setView('results');
                }
            };

            // Handle Simulated Next Question (either timeout or all answered)
            const handleNextQuestionSimulated = () => {
                if (isTransitioning) return;
                setIsTransitioning(true);

                setRoomData(prev => {
                    if (!prev) return prev;
                    const nextQ = prev.currentQ + 1;
                    if (nextQ < selectedGroup.questions.length) {
                        setCurrentQIndex(nextQ);
                        setIsTransitioning(false);
                        return {
                            ...prev,
                            currentQ: nextQ,
                            questionStartTime: Date.now()
                        };
                    } else {
                        setView('results');
                        return {
                            ...prev,
                            status: 'finished'
                        };
                    }
                });
            };

            const handleNextQuestionMulti = async (currentRoomData) => {
                if (!isHost) return;
                try {
                    const roomRef = fb.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'rooms', roomCode);
                    if (currentRoomData.currentQ < selectedGroup.questions.length - 1) {
                        await fb.updateDoc(roomRef, {
                            currentQ: currentRoomData.currentQ + 1,
                            questionStartTime: Date.now()
                        });
                    } else {
                        await fb.updateDoc(roomRef, { status: 'finished' });
                    }
                } catch (e) { console.error(e); }
            };

            const handleAnswerMultiOrSim = async (optIndex) => {
                if (mode === 'simulation') {
                    if (roomData.players['user-player']?.answers[currentQIndex] !== undefined) return;
                    
                    setRoomData(prev => {
                        const isCorrect = selectedGroup.questions[currentQIndex].options[optIndex].isCorrect;
                        const currentScore = prev.players['user-player'].score || 0;
                        const updatedPlayers = {
                            ...prev.players,
                            'user-player': {
                                ...prev.players['user-player'],
                                score: isCorrect ? currentScore + 1 : currentScore,
                                answers: {
                                    ...prev.players['user-player'].answers,
                                    [currentQIndex]: optIndex
                                }
                            }
                        };

                        // Check if everyone has answered
                        const allAnswered = Object.values(updatedPlayers).every(p => p.answers && p.answers[currentQIndex] !== undefined);
                        if (allAnswered && !isTransitioning) {
                            setTimeout(() => {
                                handleNextQuestionSimulated();
                            }, 1000);
                        }

                        return {
                            ...prev,
                            players: updatedPlayers
                        };
                    });
                } else {
                    if (roomData.players[user.uid]?.answers[currentQIndex] !== undefined) return;
                    
                    try {
                        const roomRef = fb.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'rooms', roomCode);
                        const isCorrect = selectedGroup.questions[currentQIndex].options[optIndex].isCorrect;
                        const currentScore = roomData.players[user.uid].score || 0;
                        
                        await fb.updateDoc(roomRef, {
                            [`players.${user.uid}.answers.${currentQIndex}`]: optIndex,
                            [`players.${user.uid}.score`]: isCorrect ? currentScore + 1 : currentScore
                        });
                    } catch (e) { console.error("Error submitting answer: ", e); }
                }
            };

            // Actions: Create Room (Real Firebase multiplayer)
            const handleCreateRoom = async () => {
                if (!playerName.trim()) return triggerModal("Ogohlantirish", "Iltimos, ismingizni kiriting!");
                if (!fb || fb.localOnly) {
                    // Agar Firebase ulanmagan bo'lsa, foydalanuvchiga simulyatsiya rejimini taklif qilamiz
                    return triggerModal(
                        "Ulanish Muammosi", 
                        "Sizda Firebase sozlanmagan yoki internet aloqasi yo'q! Haqiqiy multiplayer o'rniga 'Botlar bilan o'ynash' rejimidan foydalaning yoki Sozlamalar (⚙) bo'limidan Firebase kalitlarini kiriting.", 
                        "pink"
                    );
                }
                
                const code = Math.floor(100000 + Math.random() * 900000).toString();
                const newRoom = {
                    hostId: user.uid,
                    groupId: selectedGroup.id,
                    status: 'lobby',
                    currentQ: 0,
                    questionStartTime: Date.now(),
                    players: {
                        [user.uid]: { name: playerName, score: 0, answers: {} }
                    }
                };

                try {
                    await fb.setDoc(fb.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'rooms', code), newRoom);
                    setRoomCode(code);
                    setMode('multi');
                    setView('lobby');
                } catch (e) {
                    console.error(e);
                    triggerModal("Tizim Xatosi", "Kutilmagan xatolik tufayli xona yaratib bo'lmadi.", "red");
                }
            };

            // Actions: Join Room
            const handleJoinRoom = async () => {
                if (!playerName.trim()) return triggerModal("Ogohlantirish", "Iltimos, ismingizni kiriting!");
                if (!joinCode.trim()) return triggerModal("Ogohlantirish", "Xona kodini kiriting!");
                if (!fb || fb.localOnly) {
                    return triggerModal("Lokal Rejim", "Tarmoq ulanishi yo'q. Guruhga faqat simulyatsiya rejimida o'ynash mumkin.", "red");
                }
                
                try {
                    const roomRef = fb.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'rooms', joinCode);
                    const snap = await fb.getDoc(roomRef);
                    
                    if (!snap.exists()) return triggerModal("Xona topilmadi", "Bunday kodli xona mavjud emas.", "red");
                    if (snap.data().status !== 'lobby') return triggerModal("Xatolik", "Ushbu xonada o'yin allaqachon boshlanib ketgan!", "red");

                    await fb.updateDoc(roomRef, {
                        [`players.${user.uid}`]: { name: playerName, score: 0, answers: {} }
                    });

                    setRoomCode(joinCode);
                    setMode('multi');
                    setSelectedGroup(GROUPS[snap.data().groupId]);
                    setView('lobby');
                } catch (e) {
                    console.error(e);
                    triggerModal("Xatolik", "Guruhga qo'shilish amalga oshmadi.", "red");
                }
            };

            const startGameMulti = async () => {
                if (!isHost) return;
                try {
                    await fb.updateDoc(fb.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'rooms', roomCode), {
                        status: 'playing',
                        questionStartTime: Date.now(),
                        currentQ: 0
                    });
                } catch (e) { console.error(e); }
            };

            const handleEndGameEarly = async () => {
                if (mode === 'simulation') {
                    setView('results');
                    setRoomData(prev => ({ ...prev, status: 'finished' }));
                } else {
                    if (!isHost || mode !== 'multi') return;
                    try {
                        const roomRef = fb.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'rooms', roomCode);
                        await fb.updateDoc(roomRef, { status: 'finished' });
                    } catch (e) { console.error("Force end error: ", e); }
                }
            };

            // Custom Firebase config saved locally
            const handleSaveConfig = () => {
                try {
                    const parsed = JSON.parse(configInput);
                    if (!parsed.apiKey) {
                        return triggerModal("Xato", "Kiritilgan config tarkibida apiKey maydoni mavjud emas!", "red");
                    }
                    localStorage.setItem('neon_firebase_config', JSON.stringify(parsed));
                    setShowSettings(false);
                    triggerModal("Muvaffaqiyatli", "Firebase sozlamalari muvaffaqiyatli saqlandi! Sahifa yangilanmoqda...", "green");
                    setTimeout(() => window.location.reload(), 2000);
                } catch(e) {
                    triggerModal("Format xatosi", "Iltimos, sozlamalarni to'g'ri JSON formatida kiriting!", "red");
                }
            };

            const handleClearConfig = () => {
                localStorage.removeItem('neon_firebase_config');
                setShowSettings(false);
                triggerModal("Muvaffaqiyatli", "Firebase sozlamalari o'chirildi! Lokal rejimga qaytilmoqda...", "green");
                setTimeout(() => window.location.reload(), 2000);
            };

            // --- 5. EFFECT HOOKS ---

            // Safe Polling for Firebase setup
            useEffect(() => {
                let attempts = 0;
                const interval = setInterval(() => {
                    attempts++;
                    if (window.FirebaseModule) {
                        setFb(window.FirebaseModule);
                        clearInterval(interval);
                    } else if (attempts > 10) { 
                        setFb({ localOnly: true });
                        clearInterval(interval);
                    }
                }, 100);
                return () => clearInterval(interval);
            }, []);

            // Firebase authentication setup
            useEffect(() => {
                if (!fb || fb.localOnly) return;
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await fb.signInWithCustomToken(fb.auth, __initial_auth_token);
                        } else {
                            await fb.signInAnonymously(fb.auth);
                        }
                    } catch (e) {
                        console.error("Firebase auth exception: ", e);
                    }
                };
                initAuth();
                const unsubscribe = fb.onAuthStateChanged(fb.auth, setUser);
                return () => unsubscribe();
            }, [fb]);

            // Real-time synchronization for multiplayer rooms (Real Firebase mode)
            useEffect(() => {
                if (!fb || fb.localOnly || !user || !roomCode || mode !== 'multi') return;

                const roomRef = fb.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'rooms', roomCode);
                const unsubscribe = fb.onSnapshot(roomRef, (snapshot) => {
                    if (snapshot.exists()) {
                        const data = snapshot.data();
                        setRoomData(data);
                        
                        if (data.status === 'playing' && view === 'lobby') setView('playing');
                        if (data.status === 'finished' && view === 'playing') setView('results');
                        
                        if (data.currentQ !== currentQIndex) {
                            setCurrentQIndex(data.currentQ);
                            setIsTransitioning(false); 
                        }
                    } else {
                        triggerModal("Xatolik", "Xona topilmadi yoki o'chirildi.", "red");
                        setView('home');
                    }
                }, (error) => console.error("Firebase Sync error: ", error));

                return () => unsubscribe();
            }, [fb, user, roomCode, mode, view, currentQIndex]);

            // Real-time Auto-skip triggers once all users select answers (Real Firebase mode)
            useEffect(() => {
                if (mode !== 'multi' || !isHost || !roomData || roomData.status !== 'playing' || isTransitioning) return;

                const players = Object.values(roomData.players || {});
                if (players.length > 0) {
                    const allAnswered = players.every(p => p.answers && p.answers[roomData.currentQ] !== undefined);
                    if (allAnswered) {
                        setIsTransitioning(true); 
                        handleNextQuestionMulti(roomData);
                    }
                }
            }, [roomData?.players, roomData?.currentQ, roomData?.status, isHost, mode, isTransitioning]);

            // Start Simulated Multiplayer Game (with Bots)
            const handleStartSimulation = () => {
                if (!playerName.trim()) return triggerModal("Ogohlantirish", "Iltimos, ismingizni kiriting!");
                setMode('simulation');
                setRoomCode('BOTS66');
                setCurrentQIndex(0);
                setRoomData({
                    hostId: 'user-player',
                    groupId: selectedGroup.id,
                    status: 'playing',
                    currentQ: 0,
                    questionStartTime: Date.now(),
                    players: {
                        'user-player': { name: playerName, score: 0, answers: {} },
                        'bot-1': { name: "Alisher (Bot)", score: 0, answers: {} },
                        'bot-2': { name: "Madina (Bot)", score: 0, answers: {} },
                        'bot-3': { name: "Jasur (Bot)", score: 0, answers: {} }
                    }
                });
                setView('playing');
            };

            // --- SIMULATED MULTIPLAYER (BOTS) ACTION ---
            // Triggered whenever the question changes in simulation mode
            useEffect(() => {
                if (mode !== 'simulation' || view !== 'playing' || !roomData) return;

                // Clear previous simulation bot timeouts
                simulationBotsTimerRef.current.forEach(clearTimeout);
                simulationBotsTimerRef.current = [];

                const botIds = ['bot-1', 'bot-2', 'bot-3'];
                
                botIds.forEach(botId => {
                    // Bot decides answer and delay
                    const randomDelay = 3000 + Math.random() * 8000; // 3 to 11 seconds
                    const timer = setTimeout(() => {
                        setRoomData(prev => {
                            if (!prev || prev.status !== 'playing') return prev;
                            
                            const botsOptions = selectedGroup.questions[currentQIndex].options;
                            // 70% probability bot chooses correct answer
                            const chooseCorrect = Math.random() < 0.75;
                            let botChosenIndex = 0;
                            if (chooseCorrect) {
                                botChosenIndex = botsOptions.findIndex(o => o.isCorrect);
                            } else {
                                const incorrectIndices = botsOptions.map((o, idx) => !o.isCorrect ? idx : null).filter(v => v !== null);
                                botChosenIndex = incorrectIndices[Math.floor(Math.random() * incorrectIndices.length)] || 0;
                            }

                            const isCorrect = botsOptions[botChosenIndex].isCorrect;
                            const currentScore = prev.players[botId].score || 0;

                            const updatedPlayers = {
                                ...prev.players,
                                [botId]: {
                                    ...prev.players[botId],
                                    score: isCorrect ? currentScore + 1 : currentScore,
                                    answers: {
                                        ...prev.players[botId].answers,
                                        [currentQIndex]: botChosenIndex
                                    }
                                }
                            };

                            // Check if everyone (user + bots) has answered
                            const allPlayers = Object.values(updatedPlayers);
                            const allAnswered = allPlayers.every(p => p.answers && p.answers[currentQIndex] !== undefined);

                            if (allAnswered && !isTransitioning) {
                                setTimeout(() => {
                                    handleNextQuestionSimulated();
                                }, 1000);
                            }

                            return {
                                ...prev,
                                players: updatedPlayers
                            };
                        });
                    }, randomDelay);

                    simulationBotsTimerRef.current.push(timer);
                });

                return () => {
                    simulationBotsTimerRef.current.forEach(clearTimeout);
                };
            }, [currentQIndex, view, mode]);

            // Main Game Timer loop
            useEffect(() => {
                if (view !== 'playing') return;

                if (mode === 'solo') {
                    setTimeLeft(20);
                    clearInterval(timerRef.current);
                    timerRef.current = setInterval(() => {
                        setTimeLeft((prev) => {
                            if (prev <= 1) {
                                clearInterval(timerRef.current);
                                handleNextQuestionSolo();
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                } else if (mode === 'simulation') {
                    setTimeLeft(20);
                    clearInterval(timerRef.current);
                    timerRef.current = setInterval(() => {
                        setTimeLeft((prev) => {
                            if (prev <= 1) {
                                clearInterval(timerRef.current);
                                // Force Bot answers that haven't responded yet
                                setRoomData(roomState => {
                                    const botIds = ['bot-1', 'bot-2', 'bot-3'];
                                    const updatedPlayers = { ...roomState.players };
                                    
                                    botIds.forEach(botId => {
                                        if (updatedPlayers[botId].answers[currentQIndex] === undefined) {
                                            updatedPlayers[botId].answers[currentQIndex] = Math.floor(Math.random() * 4);
                                        }
                                    });
                                    return { ...roomState, players: updatedPlayers };
                                });
                                handleNextQuestionSimulated();
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                } else if (mode === 'multi' && roomData && roomData.status === 'playing') {
                    clearInterval(timerRef.current);
                    
                    const updateTimer = () => {
                        const elapsed = Math.floor((Date.now() - roomData.questionStartTime) / 1000);
                        const remaining = Math.max(0, 20 - elapsed);
                        setTimeLeft(remaining);

                        if (remaining === 0 && isHost && !isTransitioning) {
                            setIsTransitioning(true);
                            clearInterval(timerRef.current);
                            handleNextQuestionMulti(roomData);
                        }
                    };

                    updateTimer(); 
                    timerRef.current = setInterval(updateTimer, 500); 
                }

                return () => clearInterval(timerRef.current);
            }, [view, currentQIndex, roomData?.questionStartTime, mode, isHost, isTransitioning]);

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col justify-between selection:bg-cyan-500/30">
                    
                    {/* CUSTOM NEON MODAL ALERT */}
                    {modal.show && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
                            <div className="bg-slate-900 border-2 border-pink-500 rounded-3xl p-8 max-w-sm w-full text-center shadow-[0_0_40px_rgba(236,72,153,0.3)] animate-scale-up">
                                <h3 className="text-2xl font-black text-pink-500 mb-2 uppercase tracking-wide">{modal.title}</h3>
                                <p className="text-slate-300 mb-6 font-medium leading-relaxed">{modal.message}</p>
                                <NeonButton onClick={() => setModal({ ...modal, show: false })} color="pink" className="w-full">
                                    Tushunarli
                                </NeonButton>
                            </div>
                        </div>
                    )}

                    {/* SETTINGS GEAR CONFIG MODAL */}
                    {showSettings && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
                            <div className="bg-slate-900 border-2 border-cyan-400 rounded-3xl p-8 max-w-lg w-full shadow-[0_0_40px_rgba(34,211,238,0.25)]">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="text-2xl font-black text-cyan-400 uppercase tracking-wide">⚙ Firebase Sozlamalari</h3>
                                    <button onClick={() => setShowSettings(false)} className="text-slate-400 hover:text-cyan-400 font-extrabold text-xl">✕</button>
                                </div>
                                <p className="text-sm text-slate-300 mb-4 leading-relaxed">
                                    Do'stlaringiz bilan haqiqiy vaqt rejimida multiplayer o'ynash uchun o'zingizning shaxsiy Firebase konfiguratsiyangizni bu erga joylashtiring. Bu brauzeringizning shaxsiy xotirasida saqlanadi.
                                </p>
                                <textarea
                                    value={configInput}
                                    onChange={(e) => setConfigInput(e.target.value)}
                                    placeholder={`{\n  "apiKey": "YOUR_API_KEY",\n  "authDomain": "PROJECT_ID.firebaseapp.com",\n  "projectId": "PROJECT_ID",\n  "storageBucket": "PROJECT_ID.appspot.com",\n  "messagingSenderId": "SENDER_ID",\n  "appId": "APP_ID"\n}`}
                                    className="w-full h-48 bg-slate-950/80 border-2 border-cyan-500/30 rounded-xl p-4 text-xs font-mono text-cyan-300 focus:outline-none focus:border-cyan-400 focus:shadow-[0_0_10px_rgba(34,211,238,0.2)] mb-6 resize-none"
                                />
                                <div className="flex gap-4">
                                    <NeonButton onClick={handleSaveConfig} color="green" className="flex-1 py-3 text-sm">
                                        Saqlash va Ulanish
                                    </NeonButton>
                                    <button onClick={handleClearConfig} className="border border-red-500 text-red-500 hover:bg-red-500 hover:text-white px-4 py-3 rounded-xl font-bold transition-all text-sm">
                                        O'chirish
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* TOP NAVBAR */}
                    <header className="border-b border-slate-900 bg-slate-950/80 backdrop-blur-md py-4 px-6 flex justify-between items-center z-10">
                        <div className="flex items-center gap-2">
                            <div className="w-3 h-3 rounded-full bg-cyan-400 animate-pulse shadow-[0_0_8px_#22d3ee]"></div>
                            <span className="font-black text-lg tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-pink-500">NEON FALSAFA</span>
                        </div>
                        <div className="flex items-center gap-4">
                            {(!fb || fb.localOnly) ? (
                                <div className="bg-amber-500/10 border border-amber-500/40 text-amber-400 px-4 py-1.5 rounded-full text-xs font-bold tracking-widest">
                                    SOZLANMAGAN / LOKAL MULTI
                                </div>
                            ) : (
                                <div className="bg-green-500/10 border border-green-500/40 text-green-400 px-4 py-1.5 rounded-full text-xs font-bold tracking-widest">
                                    ONLINE REJIM ACTIVE
                                </div>
                            )}
                            <button onClick={() => {
                                const currentConfig = localStorage.getItem('neon_firebase_config') || "";
                                setConfigInput(currentConfig);
                                setShowSettings(true);
                            }} title="Firebase Sozlamalari">
                                <Icons.Settings />
                            </button>
                        </div>
                    </header>

                    {/* VIEWPORTS */}
                    <main className="flex-grow flex flex-col justify-center py-8">
                        
                        {/* 1. HOME VIEW */}
                        {view === 'home' && (
                            <div className="max-w-6xl mx-auto px-6 w-full">
                                <div className="text-center mb-16">
                                    <h1 className="text-5xl md:text-8xl font-black mb-4 text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-pink-500 to-purple-500 [text-shadow:_0_0_40px_rgba(236,72,153,0.3)]">
                                        NEON BATTLE
                                    </h1>
                                    <p className="text-lg md:text-xl text-cyan-200/60 font-medium tracking-[0.25em] uppercase">Guruhda Canli Test Bellashuvi</p>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {GROUPS.map((group) => (
                                        <div 
                                            key={group.id}
                                            onClick={() => { setSelectedGroup(group); setView('setup'); }}
                                            className="bg-slate-900/40 backdrop-blur-md border border-cyan-500/20 p-6 rounded-2xl cursor-pointer transition-all duration-300 hover:scale-[1.03] hover:border-cyan-400 hover:shadow-[0_0_30px_rgba(34,211,238,0.25)] group"
                                        >
                                            <div className="text-cyan-400 mb-2 group-hover:text-pink-400 transition-colors">
                                                <span className="text-4xl font-black">{group.id + 1}</span>
                                                <span className="text-lg opacity-60 ml-2 font-bold">Guruh</span>
                                            </div>
                                            <h3 className="text-xl font-bold text-slate-100 mb-2">{group.title}</h3>
                                            <p className="text-slate-400 text-sm flex items-center">
                                                <span className="w-2 h-2 rounded-full bg-cyan-400 mr-2"></span>
                                                {group.description}
                                            </p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* 2. SETUP VIEW */}
                        {view === 'setup' && (
                            <div className="flex items-center justify-center p-6 w-full animate-fade-in">
                                <div className="bg-slate-900/80 backdrop-blur-xl border border-pink-500/30 p-8 rounded-3xl w-full max-w-md shadow-[0_0_50px_rgba(236,72,153,0.15)]">
                                    <button onClick={quit} className="text-slate-400 hover:text-cyan-400 mb-6 flex items-center transition-colors font-bold">
                                        <Icons.ArrowLeft /> Ortga
                                    </button>
                                    
                                    <h2 className="text-3xl font-black text-white mb-2">{selectedGroup?.title}</h2>
                                    <p className="text-cyan-400/80 mb-8 font-medium">{selectedGroup?.description}</p>

                                    <div className="space-y-6">
                                        <div>
                                            <label className="block text-sm font-bold text-slate-400 mb-2 uppercase tracking-wider">Jangchi Ismi (Taxallus)</label>
                                            <NeonInput value={playerName} onChange={e => setPlayerName(e.target.value)} placeholder="Ismingizni yozing..." maxLength={15} />
                                        </div>

                                        <div className="grid grid-cols-2 gap-4 pt-4 border-t border-slate-800">
                                            <NeonButton onClick={startSolo} color="cyan" className="flex flex-col items-center justify-center py-6">
                                                <Icons.UserSingle />
                                                <span className="mt-2 text-xs">Yakka O'ynash</span>
                                            </NeonButton>
                                            
                                            {(!fb || fb.localOnly) ? (
                                                <NeonButton onClick={handleStartSimulation} color="pink" className="flex flex-col items-center justify-center py-6">
                                                    <Icons.Users />
                                                    <span className="mt-2 text-xs">Botlar Bilan Jang</span>
                                                </NeonButton>
                                            ) : (
                                                <NeonButton onClick={handleCreateRoom} color="pink" className="flex flex-col items-center justify-center py-6">
                                                    <Icons.Users />
                                                    <span className="mt-2 text-xs">Guruh Yaratish</span>
                                                </NeonButton>
                                            )}
                                        </div>

                                        <div className="relative flex items-center py-2">
                                            <div className="flex-grow border-t border-slate-800"></div>
                                            <span className="flex-shrink-0 mx-4 text-slate-500 text-xs font-bold uppercase">Yoki Do'stlar Guruhiga qo'shilish</span>
                                            <div className="flex-grow border-t border-slate-800"></div>
                                        </div>

                                        <div className="flex space-x-2">
                                            <NeonInput value={joinCode} onChange={e => setJoinCode(e.target.value)} placeholder="6 xonali kod" maxLength={6} type="number" />
                                            <NeonButton onClick={handleJoinRoom} color="green" className="px-5">
                                                <Icons.LogIn />
                                            </NeonButton>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 3. LOBBY VIEW */}
                        {view === 'lobby' && (
                            <div className="flex flex-col items-center justify-center p-6 w-full">
                                <div className="bg-slate-900/80 border border-cyan-500/50 p-8 rounded-3xl w-full max-w-lg text-center shadow-[0_0_30px_rgba(34,211,238,0.2)]">
                                    <h2 className="text-cyan-400 uppercase tracking-widest text-sm font-extrabold mb-2">ULASHISH UCHUN XONA KODI</h2>
                                    <div className="text-6xl font-black text-white mb-8 tracking-[0.15em] neon-glow-cyan">
                                        {roomCode}
                                    </div>

                                    <div className="bg-slate-950/50 rounded-xl p-5 mb-8 min-h-[180px] text-left">
                                        <h3 className="text-slate-400 mb-4 flex items-center font-bold border-b border-slate-800 pb-2">
                                            <span className="mr-2 text-cyan-400 animate-bounce">●</span> Jangchilar ({roomData?.players ? Object.values(roomData.players).length : 0})
                                        </h3>
                                        <div className="flex flex-wrap gap-3">
                                            {roomData?.players && Object.values(roomData.players).map((p, i) => (
                                                <span key={i} className="bg-cyan-500/10 border border-cyan-500/30 text-cyan-300 px-4 py-2 rounded-full font-bold shadow-[0_0_10px_rgba(34,211,238,0.1)]">
                                                    {p.name}
                                                </span>
                                            ))}
                                        </div>
                                    </div>

                                    {isHost ? (
                                        <NeonButton onClick={startGameMulti} color="green" className="w-full py-4 text-xl">
                                            <Icons.Play /> &nbsp; BATTLE-NI BOSHLASH
                                        </NeonButton>
                                    ) : (
                                        <p className="text-pink-500 animate-pulse text-lg tracking-widest uppercase font-extrabold">Host o'yinni boshlashini kuting...</p>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* 4. PLAYING VIEW */}
                        {view === 'playing' && question && (
                            <div className="w-full px-4 md:px-8 flex flex-col lg:flex-row gap-6 max-w-7xl mx-auto">
                                <div className="flex-grow max-w-4xl flex flex-col w-full">
                                    
                                    {/* Question Card Header */}
                                    <div className="flex justify-between items-end mb-6">
                                        <div>
                                            <span className="text-pink-500 font-extrabold tracking-widest text-sm uppercase">{selectedGroup?.title}</span>
                                            <h2 className="text-3xl font-black text-slate-100">Savol {currentQIndex + 1} / {selectedGroup?.questions?.length}</h2>
                                        </div>
                                        <div className="flex items-center gap-4">
                                            <div className="flex items-center text-3xl font-black">
                                                <Icons.Clock /> &nbsp;
                                                <span className={timeLeft <= 5 ? 'text-red-500 animate-pulse' : 'text-cyan-400'}>
                                                    00:{timeLeft.toString().padStart(2, '0')}
                                                </span>
                                            </div>
                                            
                                            {isHost && (
                                                <NeonButton onClick={handleEndGameEarly} color="red" className="py-2 px-4 text-sm font-bold animate-pulse">
                                                    <Icons.Power /> &nbsp; Tugatish
                                                </NeonButton>
                                            )}
                                        </div>
                                    </div>

                                    {/* Neon Loading Progress Bar */}
                                    <div className="w-full h-3 bg-slate-900 rounded-full mb-8 overflow-hidden border border-slate-800">
                                        <div 
                                            className={`h-full transition-all duration-1000 linear ${
                                                timeLeft > 10 ? 'bg-cyan-400 shadow-[0_0_10px_#22d3ee]' : 
                                                timeLeft > 5 ? 'bg-yellow-400 shadow-[0_0_10px_#facc15]' : 
                                                'bg-red-500 shadow-[0_0_10px_#ef4444] animate-pulse'
                                            }`} 
                                            style={{ width: `${(timeLeft / 20) * 100}%` }}
                                        ></div>
                                    </div>

                                    {/* The Question Box */}
                                    <div className="bg-slate-900/60 backdrop-blur-lg border border-slate-800 p-6 md:p-10 rounded-3xl shadow-[0_0_40px_rgba(0,0,0,0.6)] mb-8 flex-grow flex flex-col justify-center">
                                        <h3 className="text-2xl md:text-3xl font-bold leading-relaxed mb-10 text-center text-slate-100">
                                            {question.text}
                                        </h3>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-auto">
                                            {question.options.map((opt, idx) => {
                                                let btnStyle = "border-slate-800 bg-slate-900/40 text-slate-300 hover:border-cyan-400 hover:bg-slate-900/60";
                                                
                                                if (hasAnswered) {
                                                    if (opt.isCorrect) {
                                                        btnStyle = "border-green-400 bg-green-500/10 text-green-300 shadow-[0_0_15px_rgba(74,222,128,0.3)]";
                                                    } else if (myAnswer === idx && !opt.isCorrect) {
                                                        btnStyle = "border-red-500 bg-red-500/10 text-red-300 shadow-[0_0_15px_rgba(239,68,68,0.3)]";
                                                    } else {
                                                        btnStyle = "border-slate-950 bg-slate-950/60 text-slate-600 opacity-40";
                                                    }
                                                }

                                                return (
                                                    <button
                                                        key={idx}
                                                        onClick={() => mode === 'solo' ? handleAnswerSolo(idx) : handleAnswerMultiOrSim(idx)}
                                                        disabled={hasAnswered}
                                                        className={`p-5 rounded-2xl border-2 text-lg font-bold text-left transition-all duration-300 flex items-center ${btnStyle}`}
                                                    >
                                                        <span className="w-8 font-extrabold opacity-40 text-xl mr-2">{['A','B','C','D'][idx]}</span>
                                                        <span className="flex-grow">{opt.text}</span>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                    
                                    {mode === 'solo' && hasAnswered && (
                                         <div className="flex justify-end animate-fade-in">
                                             <NeonButton onClick={handleNextQuestionSolo} color="pink">
                                                 Keyingisi &nbsp; ➜
                                             </NeonButton>
                                         </div>
                                    )}
                                </div>

                                {/* Live Leaderboard Widget */}
                                {(mode === 'multi' || mode === 'simulation') && roomData && (
                                    <div className="w-full lg:w-80 bg-slate-900/40 border border-pink-500/20 rounded-3xl p-6 flex flex-col h-full lg:max-h-[80vh] animate-slide-up">
                                        <h3 className="text-pink-400 font-extrabold tracking-widest uppercase mb-6 flex items-center border-b border-slate-800 pb-3">
                                            <Icons.Trophy /> &nbsp; Live Reyting
                                        </h3>
                                        <div className="space-y-4 overflow-y-auto pr-2 custom-scrollbar flex-grow">
                                            {playersList.map((p, i) => {
                                                // Check if this specific player has answered the current question
                                                const hasPlayerAnswered = p.answers && p.answers[currentQIndex] !== undefined;
                                                return (
                                                    <div key={i} className={`p-4 rounded-xl flex justify-between items-center transition-all ${p.name === playerName ? 'bg-cyan-500/10 border border-cyan-500/40 shadow-[0_0_15px_rgba(34,211,238,0.1)]' : 'bg-slate-900/30'}`}>
                                                        <div className="flex items-center">
                                                            <span className="w-6 h-6 rounded-full bg-slate-950 flex items-center justify-center text-xs font-black mr-3 text-cyan-400 border border-cyan-500/30">
                                                                {i + 1}
                                                            </span>
                                                            <span className="font-bold truncate max-w-[100px]" title={p.name}>{p.name}</span>
                                                        </div>
                                                        <div className="flex flex-col items-end">
                                                            <div className="text-cyan-300 font-black text-sm">
                                                                {p.score || 0} <span className="text-xs opacity-50 ml-1">PT</span>
                                                            </div>
                                                            {hasPlayerAnswered && <span className="text-[10px] text-green-400 font-bold mt-1">Javob berdi ✓</span>}
                                                        </div>
                                                    </div>
                                                )
                                            })}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* 5. RESULTS VIEW */}
                        {view === 'results' && (
                            <div className="max-w-5xl mx-auto px-6 w-full animate-fade-in">
                                
                                <div className="flex justify-between items-center mb-10 border-b border-slate-900 pb-6">
                                    <h1 className="text-4xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-pink-500">BATTLE YAKUNI</h1>
                                    <NeonButton onClick={quit} color="cyan">
                                        <Icons.Home /> Bosh sahifa
                                    </NeonButton>
                                </div>

                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                    {/* Glowing Circle percentage indicator */}
                                    {(() => {
                                        let myScore = 0;
                                        if (mode === 'solo') {
                                            selectedGroup?.questions?.forEach((q, i) => {
                                                const myAnsIdx = localAnswers[i];
                                                if (myAnsIdx !== undefined && q.options[myAnsIdx].isCorrect) myScore++;
                                            });
                                        } else if (roomData) {
                                            const activeUid = mode === 'simulation' ? 'user-player' : user?.uid;
                                            myScore = roomData.players?.[activeUid]?.score || 0;
                                        }
                                        const total = (mode === 'multi' || mode === 'simulation') ? (roomData?.currentQ + 1 || 1) : (selectedGroup?.questions?.length || 1);
                                        const percentage = Math.round((myScore / total) * 100);

                                        return (
                                            <div className="lg:col-span-1 bg-slate-900/60 border border-cyan-500/30 rounded-3xl p-8 text-center shadow-[0_0_30px_rgba(34,211,238,0.1)] flex flex-col items-center justify-center">
                                                <div className="w-44 h-44 rounded-full border-4 border-slate-800 flex items-center justify-center mb-6 relative">
                                                    <svg className="absolute inset-0 w-full h-full -rotate-90">
                                                        <circle cx="88" cy="88" r="82" className="stroke-slate-800 fill-none" strokeWidth="8" />
                                                        <circle cx="88" cy="88" r="82" className="stroke-cyan-400 fill-none transition-all duration-1000" strokeWidth="8" strokeDasharray={2 * Math.PI * 82} strokeDashoffset={2 * Math.PI * 82 * (1 - (percentage || 0)/100)} />
                                                    </svg>
                                                    <div className="text-5xl font-black text-white">{percentage || 0}%</div>
                                                </div>
                                                <h2 className="text-2xl font-black mb-1">{playerName}</h2>
                                                <p className="text-slate-400 font-bold text-lg">{myScore} ta to'g'ri / {total} ta savoldan</p>
                                            </div>
                                        );
                                    })()}

                                    {/* Scoreboards (Only for Multi modes) */}
                                    {(mode === 'multi' || mode === 'simulation') && roomData && (
                                        <div className="lg:col-span-2 bg-slate-900/40 border border-pink-500/20 rounded-3xl p-8">
                                             <h3 className="text-2xl font-black text-pink-500 mb-6 flex items-center">
                                                🏆 &nbsp; Yakuniy Reyting
                                             </h3>
                                            <div className="space-y-3">
                                                {playersList.map((p, i) => (
                                                    <div key={i} className={`p-5 rounded-2xl flex justify-between items-center ${i === 0 ? 'bg-gradient-to-r from-yellow-500/10 to-transparent border border-yellow-500/40 shadow-[0_0_20px_rgba(234,179,8,0.15)]' : 'bg-slate-900/30'}`}>
                                                        <div className="flex items-center text-xl">
                                                            <span className={`w-9 h-9 rounded-full flex items-center justify-center font-black mr-4 ${i===0 ? 'bg-yellow-500 text-black shadow-[0_0_10px_#eab308]' : 'bg-slate-800 text-slate-300'}`}>
                                                                {i + 1}
                                                            </span>
                                                            <span className="font-extrabold">{p.name}</span>
                                                        </div>
                                                        <div className="text-2xl font-black text-cyan-400">
                                                            {p.score || 0} <span className="text-sm font-bold text-slate-500">PT</span>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>

                                {/* Custom Incorrect Answers Review Box */}
                                {(() => {
                                    const mistakes = [];
                                    if (mode === 'solo' && selectedGroup) {
                                        selectedGroup.questions.forEach((q, i) => {
                                            const myAnsIdx = localAnswers[i];
                                            if (myAnsIdx === undefined || !q.options[myAnsIdx].isCorrect) {
                                                mistakes.push({
                                                    text: q.text,
                                                    myAns: myAnsIdx !== undefined ? q.options[myAnsIdx].text : "Javob berilmagan",
                                                    correctAns: q.options.find(o => o.isCorrect).text
                                                });
                                            }
                                        });
                                    } else if (roomData && selectedGroup) {
                                        const maxQuestionReached = roomData.currentQ;
                                        const activeUid = mode === 'simulation' ? 'user-player' : user?.uid;
                                        for (let i = 0; i <= maxQuestionReached; i++) {
                                            const q = selectedGroup.questions[i];
                                            const myAnsIdx = roomData.players?.[activeUid]?.answers?.[i];
                                            if (myAnsIdx === undefined || !q.options[myAnsIdx].isCorrect) {
                                                mistakes.push({
                                                    text: q.text,
                                                    myAns: myAnsIdx !== undefined ? q.options[myAnsIdx].text : "Javob berilmagan",
                                                    correctAns: q.options.find(o => o.isCorrect).text
                                                });
                                            }
                                        }
                                    }

                                    if (mistakes.length === 0) return null;

                                    return (
                                        <div className="mt-8 bg-slate-900/40 border border-slate-800 rounded-3xl p-6 md:p-10">
                                            <h3 className="text-2xl font-black text-red-400 mb-8 flex items-center">
                                                ❌ &nbsp; Xatolar Tahlili ({mistakes.length} ta)
                                            </h3>
                                            <div className="space-y-6">
                                                {mistakes.map((m, i) => (
                                                    <div key={i} className="bg-slate-950/60 p-6 rounded-2xl border-l-4 border-red-500">
                                                        <p className="text-lg font-bold mb-4 text-slate-100">{m.text}</p>
                                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm font-bold">
                                                            <div className="bg-red-500/10 border border-red-500/20 p-4 rounded-xl text-red-300">
                                                                <span className="block text-red-500 text-xs font-black uppercase mb-1">Sizning javobingiz:</span>
                                                                {m.myAns}
                                                            </div>
                                                            <div className="bg-green-500/10 border border-green-500/20 p-4 rounded-xl text-green-300">
                                                                <span className="block text-green-500 text-xs font-black uppercase mb-1">To'g'ri javob:</span>
                                                                {m.correctAns}
                                                            </div>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    );
                                })()}
                            </div>
                        )}
                    </main>

                    {/* TOP FOOTER */}
                    <footer className="border-t border-slate-900 bg-slate-950/30 py-4 px-6 text-center text-xs text-slate-500 font-medium">
                        © 2026 Neon Falsafa Battle | Barcha huquqlar himoyalangan.
                    </footer>
                </div>
            );
        }

        // Initialize and Mount React Application
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
