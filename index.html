        body {
            font-family: 'Inter', sans-serif;
            background-color: #F0F4F8;
            color: #1e293b;
            -webkit-tap-highlight-color: transparent;
        }

        /* 3D Kartochka effektlari */
        .perspective-1000 { perspective: 1000px; }
        .preserve-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .transition-transform { transition: transform 0.7s cubic-bezier(0.4, 0.2, 0.2, 1); }

        /* Konfetti animatsiyasi */
        @keyframes confettiFall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            10% { opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
        .confetti {
            position: absolute;
            top: -20px;
            width: 14px;
            height: 14px;
            border-radius: 3px;
            opacity: 0;
            animation: confettiFall 3.5s ease-in forwards;
        }

        /* Maxsus scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    <!-- Asosiy JavaScript Mantig'i -->
    <script>
        // ==========================================
        // 1. O'ZGARUVCHILAR VA SOZLAMALAR
        // ==========================================
        
        // DASTURCHI UCHUN: API kalitni shu yerga kiriting
        const API_KEY = "AIzaSyCVoV1cPOY4fiJOjEzSzX9a68dfCrCxaZE"; 
        
        let state = {
            activeTab: 'home',
            extractedWords: [],
            savedWords: [],
            imageBase64: null,
            isLoading: false,
            playingAudioId: null,
            // Flashcard holati
            cardIndex: 0,
            isCardFlipped: false,
            // Quiz holati
            quizQuestionIndex: 0,
            quizScore: 0,
            quizShowResult: false,
            quizOptions: [],
            quizSelectedOption: null,
            quizShuffledWords: []
        };

        // DOM yuklanganda ikonkalarni ishga tushirish
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            loadSavedWords(); // Agar LocalStorage dan yuklash kerak bo'lsa
            renderUI();
        });

        // ==========================================
        // 2. YORDAMCHI FUNKSIYALAR
        // ==========================================

        async function fetchWithRetry(url, options, maxRetries = 5) {
            let retries = 0;
            const delays = [1000, 2000, 4000, 8000, 16000];

            while (retries < maxRetries) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) {
                        throw new Error(`HTTP xatolik! status: ${response.status}`);
                    }
                    return await response.json();
                } catch (error) {
                    retries++;
                    if (retries >= maxRetries) {
                        throw new Error("Kechirasiz, tarmoqda xatolik yuz berdi. Iltimos, qaytadan urinib ko'ring.");
                    }
                    await new Promise(resolve => setTimeout(resolve, delays[retries - 1]));
                }
            }
        }

        function pcmToWav(pcmData, sampleRate = 24000) {
            const numChannels = 1; 
            const bytesPerSample = 2; 
            const byteRate = sampleRate * numChannels * bytesPerSample;
            const blockAlign = numChannels * bytesPerSample;

            const buffer = new ArrayBuffer(44 + pcmData.length);
            const view = new DataView(buffer);

            const writeString = (offset, string) => {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            };

            writeString(0, 'RIFF');
            view.setUint32(4, 36 + pcmData.length, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, byteRate, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, 16, true);
            writeString(36, 'data');
            view.setUint32(40, pcmData.length, true);

            const pcmView = new Uint8Array(pcmData);
            for (let i = 0; i < pcmView.length; i++) {
                view.setUint8(44 + i, pcmView[i]);
            }

            return new Blob([view], { type: 'audio/wav' });
        }

        // ==========================================
        // 3. OVOZLI O'QISH (TTS API)
        // ==========================================

        async function playHumanAudio(text, id, event) {
            if (event) {
                event.stopPropagation();
                event.preventDefault();
            }

            if (state.playingAudioId) return;

            if(!API_KEY || API_KEY === "AIzaSyCVoV1cPOY4fiJOjEzSzX9a68dfCrCxaZE") {
                alert("Ovozli o'qish uchun API kalit kiritilmagan.");
                // Brauzer ovoziga o'tish
                fallbackAudio(text, id);
                return;
            }

            state.playingAudioId = id;
            renderUI(); // Animatsiyani boshlash

            try {
                const payload = {
                    contents: [{ parts: [{ text: text }] }],
                    generationConfig: {
                        responseModalities: ["AUDIO"],
                        speechConfig: {
                            voiceConfig: { prebuiltVoiceConfig: { voiceName: "Kore" } }
                        }
                    },
                    model: "gemini-2.5-flash-preview-tts"
                };

                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${API_KEY}`;
                
                const response = await fetchWithRetry(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const audioBase64 = response.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
                const mimeType = response.candidates?.[0]?.content?.parts?.[0]?.inlineData?.mimeType;

                if (audioBase64) {
                    const binaryString = window.atob(audioBase64);
                    const len = binaryString.length;
                    const bytes = new Uint8Array(len);
                    for (let i = 0; i < len; i++) {
                        bytes[i] = binaryString.charCodeAt(i);
                    }

                    let sampleRate = 24000;
                    if (mimeType && mimeType.includes('rate=')) {
                        const match = mimeType.match(/rate=(\d+)/);
                        if(match) sampleRate = parseInt(match[1], 10);
                    }

                    const blob = pcmToWav(bytes.buffer, sampleRate);
                    const audioUrl = URL.createObjectURL(blob);
                    
                    const audio = new Audio(audioUrl);
                    audio.onended = () => {
                        state.playingAudioId = null;
                        URL.revokeObjectURL(audioUrl);
                        renderUI();
                    };
                    audio.onerror = () => {
                        state.playingAudioId = null;
                        renderUI();
                    };
