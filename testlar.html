<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Falsafa Battle</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React and ReactDOM from CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX compilation in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Custom Neon Styles -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #020617;
        }
        /* Custom Scrollbar for Neon */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(30, 41, 59, 0.5);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #22d3ee;
            border-radius: 10px;
            box-shadow: 0 0 10px #22d3ee;
        }
        /* Text Glows */
        .neon-glow-cyan {
            text-shadow: 0 0 15px rgba(34, 211, 238, 0.6), 0 0 30px rgba(34, 211, 238, 0.2);
        }
        .neon-glow-pink {
            text-shadow: 0 0 15px rgba(236, 72, 153, 0.6), 0 0 30px rgba(236, 72, 153, 0.2);
        }
    </style>
</head>
<body class="text-slate-100 overflow-x-hidden">

    <div id="root"></div>

    <!-- Firebase SDKs -->
    <script type="module" defer>
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global Firebase Configuration fallback
        const firebaseConfig = window.__firebase_config ? JSON.parse(window.__firebase_config) : {
            apiKey: "", // Key placeholder, environment overrides this if available
            authDomain: "test-quiz-app.firebaseapp.com",
            projectId: "test-quiz-app",
            storageBucket: "test-quiz-app.appspot.com",
            messagingSenderId: "12345678",
            appId: "1:1234:web:1234"
        };
        const appId = window.__app_id || 'neon-quiz-app';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Expose Firebase to our React application
        window.FirebaseModule = {
            auth,
            db,
            appId,
            signInAnonymously,
            signInWithCustomToken,
            onAuthStateChanged,
            doc,
            setDoc,
            getDoc,
            updateDoc,
            onSnapshot
        };
    </script>

    <!-- React Application Component in Babel/JSX -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- SAVOLLAR BAZASI (PDF dan tahlil qilingan haqiqiy falsafiy testlar namunasi) ---
        const sampleQuestions = [
            { q: "Falsafa tushunchasining ma'nosi?", o: ["#Yunoncha phileo - sevaman, sophia - donolik so'zlaridan kelib chiqqan", "Texnologiya va san'at", "Siyosiy va ijtimoiy masalalar", "Axloq va qadriyatlar"] },
            { q: "Falsafaning ontologiya bo'limida qanday masalalar oʻrganiladi?", o: ["#Borliq va mavjudlik mohiyatini", "Yer osti boyliklarini aniqlash", "Kimyoviy moddalarni", "Shaxsiy tajribalarni"] },
            { q: "Falsafa va dinning umumiy maqsadi nima?", o: ["#Olam va insonning mohiyatini anglash", "Olamning kosmologik modelini yaratish", "Mehnat haqida nazariyalar yaratish", "Tajribaga asoslanish"] },
            { q: "Falsafiy bilimlarning muhim tarkibiy qismlaridan biri ......?", o: ["#Gnoseologiya", "Fizika", "Kimyo", "Shaxsiy e'tiqodlar"] },
            { q: "Falsafaning madaniy funksiyasi nimani anglatadi?", o: ["#Insoniyatning umumiy madaniy taraqqiyotiga xizmat qilish", "Diniy qadriyatlarni mustahkamlash", "Ilmiy qonunlarni tushuntirish", "Jamiyatni axloqiy tarbiyalash"] },
            { q: "Forobiyning fikriga koʻra, toʻliqsiz jamiyat bu?", o: ["#Oila, mahalla", "Dunyo", "Davlat", "Tarix"] },
            { q: "Madaniyatning jamiyatdagi vazifasi nimadan iborat?", o: ["#Munosabatlar va qadriyatlarni tartibga solish", "Siyosiy boshqaruvni kuchaytirish", "Faqat iqtisodiy tizimlarni rivojlantirish", "Ijtimoiy guruhlarni bo'lish"] },
            { q: "Jamiyatning paydo bo'lishi qanday omillarga asoslanadi?", o: ["#Mehnat va muloqotga", "Tasodifiy hodisalarning birlashuviga", "Biologik evolyutsiya natijasiga", "Tabiiy resurslarning mavjudliga"] },
            { q: "Kantning 'narsa oʻzida' konsepsiyasi nimani anglatadi?", o: ["#Hissiyot va tafakkurga bog'liq bo'lmagan borliqni", "Biz biladigan narsalarni", "Ilmiy tadqiqot ob'yektini", "Sub'yektiv bilimni"] },
            { q: "Sub'yekt va ob'yekt o'rtasidagi asosiy munosabat nima?", o: ["#Sub'yekt bilish faoliyatining manbai, ob'yekt esa bilishning maqsadi", "Ikkalasi ham bilish jarayonida faqat kuzatuvchi hisoblanadi", "Subyekt bilish obyektining bir qismidir", "Obyekt subyektning tasodifiy qismidir"] }
        ];

        // 10 ta guruh uchun 50 tadan jami 500 ta savol hosil qiluvchi generator
        const generateGroups = () => {
            const groups = [];
            for (let i = 0; i < 10; i++) {
                const groupQuestions = [];
                for (let j = 0; j < 50; j++) {
                    const baseQ = sampleQuestions[j % sampleQuestions.length];
                    const parsedOptions = baseQ.o.map(opt => ({
                        text: opt.replace('#', ''),
                        isCorrect: opt.startsWith('#')
                    })).sort(() => Math.random() - 0.5); 
                    
                    groupQuestions.push({
                        id: `g${i}_q${j}`,
                        text: `${j + 1}. ${baseQ.q}`,
                        options: parsedOptions
                    });
                }
                groups.push({
                    id: i,
                    title: `${i + 1} - Guruh`,
                    description: `${i * 50 + 1} dan ${(i + 1) * 50} gacha savollar`,
                    questions: groupQuestions
                });
            }
            return groups;
        };

        const GROUPS = generateGroups();

        // --- INTERFAOL NEON TUGMALAR ---
        const NeonButton = ({ children, onClick, color = 'cyan', className = '', disabled = false }) => {
            const colors = {
                cyan: 'border-cyan-400 text-cyan-400 hover:bg-cyan-400 hover:text-gray-950 shadow-[0_0_10px_rgba(34,211,238,0.3)] hover:shadow-[0_0_20px_rgba(34,211,238,0.8)]',
                pink: 'border-pink-500 text-pink-500 hover:bg-pink-500 hover:text-gray-950 shadow-[0_0_10px_rgba(236,72,153,0.3)] hover:shadow-[0_0_20px_rgba(236,72,153,0.8)]',
                green: 'border-green-400 text-green-400 hover:bg-green-400 hover:text-gray-950 shadow-[0_0_10px_rgba(74,222,128,0.3)] hover:shadow-[0_0_20px_rgba(74,222,128,0.8)]',
                red: 'border-red-500 text-red-500 hover:bg-red-500 hover:text-gray-950 shadow-[0_0_10px_rgba(239,68,68,0.3)] hover:shadow-[0_0_20px_rgba(239,68,68,0.8)]',
            };

            return (
                <button
                    onClick={onClick}
                    disabled={disabled}
                    className={`border-2 px-6 py-3 rounded-xl font-extrabold tracking-wider transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center ${colors[color]} ${className}`}
                >
                    {children}
                </button>
            );
        };

        const NeonInput = ({ value, onChange, placeholder, type = 'text', maxLength }) => (
            <input
                type={type}
                value={value}
                onChange={onChange}
                placeholder={placeholder}
                maxLength={maxLength}
                className="w-full bg-slate-900/60 border-2 border-cyan-500/50 rounded-xl px-4 py-3 text-cyan-50 focus:outline-none focus:border-cyan-400 focus:shadow-[0_0_15px_rgba(34,211,238,0.5)] transition-all text-center text-xl font-bold tracking-widest placeholder:text-cyan-800"
            />
        );

        // --- ASOSIY APPARAT COMPONENTI ---
        function App() {
            const [fb, setFb] = useState(null);
            const [user, setUser] = useState(null);
            const [view, setView] = useState('home'); 
            const [selectedGroup, setSelectedGroup] = useState(null);
            const [mode, setMode] = useState(null); 
            const [playerName, setPlayerName] = useState('');
            const [roomCode, setRoomCode] = useState('');
            const [joinCode, setJoinCode] = useState('');
            
            const [roomData, setRoomData] = useState(null);
            const [currentQIndex, setCurrentQIndex] = useState(0);
            const [timeLeft, setTimeLeft] = useState(20);
            const [localAnswers, setLocalAnswers] = useState({}); 
            const [isTransitioning, setIsTransitioning] = useState(false);
            
            const timerRef = useRef(null);
            const isHost = roomData?.hostId === user?.uid;

            // Wait until Firebase SDK is initialized and exposed globally
            useEffect(() => {
                const interval = setInterval(() => {
                    if (window.FirebaseModule) {
                        setFb(window.FirebaseModule);
                        clearInterval(interval);
                    }
                }, 100);
                return () => clearInterval(interval);
            }, []);

            // Handle Authentication once FirebaseModule is ready
            useEffect(() => {
                if (!fb) return;
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await fb.signInWithCustomToken(fb.auth, __initial_auth_token);
                        } else {
                            await fb.signInAnonymously(fb.auth);
                        }
                    } catch (e) {
                        console.error("Auth Exception: ", e);
                    }
                };
                initAuth();
                const unsubscribe = fb.onAuthStateChanged(fb.auth, setUser);
                return () => unsubscribe();
            }, [fb]);

            // Real-time listener for multiplayer rooms
            useEffect(() => {
                if (!fb || !user || !roomCode || mode !== 'multi') return;

                const roomRef = fb.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'rooms', roomCode);
                const unsubscribe = fb.onSnapshot(roomRef, (snapshot) => {
                    if (snapshot.exists()) {
                        const data = snapshot.data();
                        setRoomData(data);
                        
                        if (data.status === 'playing' && view === 'lobby') setView('playing');
                        if (data.status === 'finished' && view === 'playing') setView('results');
                        
                        if (data.currentQ !== currentQIndex) {
                            setCurrentQIndex(data.currentQ);
                            setIsTransitioning(false); 
                        }
                    } else {
                        alert("Xona topilmadi yoki o'chirilgan.");
                        setView('home');
                    }
                }, (error) => console.error("Firebase Sync error: ", error));

                return () => unsubscribe();
            }, [fb, user, roomCode, mode, view, currentQIndex]);

            // Auto-skip logic if everyone answered in real-time
            useEffect(() => {
                if (!isHost || mode !== 'multi' || !roomData || roomData.status !== 'playing' || isTransitioning) return;

                const players = Object.values(roomData.players || {});
                if (players.length > 0) {
                    const allAnswered = players.every(p => p.answers && p.answers[roomData.currentQ] !== undefined);
                    if (allAnswered) {
                        setIsTransitioning(true); 
                        handleNextQuestionMulti(roomData);
                    }
                }
            }, [roomData?.players, roomData?.currentQ, roomData?.status, isHost, mode, isTransitioning]);

            // Main Timer Logic
            useEffect(() => {
                if (view !== 'playing') return;

                if (mode === 'solo') {
                    setTimeLeft(20);
                    clearInterval(timerRef.current);
                    timerRef.current = setInterval(() => {
                        setTimeLeft((prev) => {
                            if (prev <= 1) {
                                clearInterval(timerRef.current);
                                handleNextQuestionSolo();
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                } else if (mode === 'multi' && roomData && roomData.status === 'playing') {
                    clearInterval(timerRef.current);
                    
                    const updateTimer = () => {
                        const elapsed = Math.floor((Date.now() - roomData.questionStartTime) / 1000);
                        const remaining = Math.max(0, 20 - elapsed);
                        setTimeLeft(remaining);

                        if (remaining === 0 && isHost && !isTransitioning) {
                            setIsTransitioning(true);
                            clearInterval(timerRef.current);
                            handleNextQuestionMulti(roomData);
                        }
                    };

                    updateTimer(); 
                    timerRef.current = setInterval(updateTimer, 500); 
                }

                return () => clearInterval(timerRef.current);
            }, [view, currentQIndex, roomData?.questionStartTime, mode, isHost, isTransitioning]);

            // Multi: Room Creation
            const handleCreateRoom = async () => {
                if (!playerName.trim()) return alert("Iltimos ismingizni kiriting!");
                const code = Math.floor(100000 + Math.random() * 900000).toString();
                
                const newRoom = {
                    hostId: user.uid,
                    groupId: selectedGroup.id,
                    status: 'lobby',
                    currentQ: 0,
                    questionStartTime: Date.now(),
                    players: {
                        [user.uid]: { name: playerName, score: 0, answers: {} }
                    }
                };

                try {
                    await fb.setDoc(fb.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'rooms', code), newRoom);
                    setRoomCode(code);
                    setMode('multi');
                    setView('lobby');
                } catch (e) {
                    console.error(e);
                    alert("Xona yaratish imkonsiz bo'ldi.");
                }
            };

            // Multi: Joining Room
            const handleJoinRoom = async () => {
                if (!playerName.trim() || !joinCode.trim()) return alert("Ism va maxsus kodni kiriting!");
                
                try {
                    const roomRef = fb.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'rooms', joinCode);
                    const snap = await fb.getDoc(roomRef);
                    
                    if (!snap.exists()) return alert("Xona topilmadi. Kodni qayta tekshiring.");
                    if (snap.data().status !== 'lobby') return alert("Afsus, bu o'yin allaqachon boshlangan!");

                    await fb.updateDoc(roomRef, {
                        [`players.${user.uid}`]: { name: playerName, score: 0, answers: {} }
                    });

                    setRoomCode(joinCode);
                    setMode('multi');
                    setSelectedGroup(GROUPS[snap.data().groupId]);
                    setView('lobby');
                } catch (e) {
                    console.error(e);
                    alert("Guruhga qo'shilish muvaffaqiyatsiz tugadi.");
                }
            };

            // Multi: Start Battle
            const startGameMulti = async () => {
                if (!isHost) return;
                try {
                    await fb.updateDoc(fb.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'rooms', roomCode), {
                        status: 'playing',
                        questionStartTime: Date.now(),
                        currentQ: 0
                    });
                } catch (e) { console.error(e); }
            };

            // Solo: Start Game
            const startSolo = () => {
                if (!playerName.trim()) return alert("Ismingizni kiriting!");
                setMode('solo');
                setLocalAnswers({});
                setCurrentQIndex(0);
                setView('playing');
            };

            // Solo Answer Handler
            const handleAnswerSolo = (optIndex) => {
                if (localAnswers[currentQIndex] !== undefined) return; 
                setLocalAnswers(prev => ({ ...prev, [currentQIndex]: optIndex }));
            };

            // Solo Next Question
            const handleNextQuestionSolo = () => {
                if (currentQIndex < selectedGroup.questions.length - 1) {
                    setCurrentQIndex(prev => prev + 1);
                } else {
                    setView('results');
                }
            };

            // Multi Answer Submission
            const handleAnswerMulti = async (optIndex) => {
                if (roomData.players[user.uid]?.answers[currentQIndex] !== undefined) return;
                
                try {
                    const roomRef = fb.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'rooms', roomCode);
                    const isCorrect = selectedGroup.questions[currentQIndex].options[optIndex].isCorrect;
                    const currentScore = roomData.players[user.uid].score || 0;
                    
                    await fb.updateDoc(roomRef, {
                        [`players.${user.uid}.answers.${currentQIndex}`]: optIndex,
                        [`players.${user.uid}.score`]: isCorrect ? currentScore + 1 : currentScore
                    });
                } catch (e) { console.error("Submit Answer error: ", e); }
            };

            // Multi Next Question Skipper
            const handleNextQuestionMulti = async (currentRoomData) => {
                if (!isHost) return;
                try {
                    const roomRef = fb.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'rooms', roomCode);
                    if (currentRoomData.currentQ < selectedGroup.questions.length - 1) {
                        await fb.updateDoc(roomRef, {
                            currentQ: currentRoomData.currentQ + 1,
                            questionStartTime: Date.now()
                        });
                    } else {
                        await fb.updateDoc(roomRef, { status: 'finished' });
                    }
                } catch (e) { console.error(e); }
            };

            // Host Option to End early
            const handleEndGameEarly = async () => {
                if (!isHost || mode !== 'multi') return;
                try {
                    const roomRef = fb.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'rooms', roomCode);
                    await fb.updateDoc(roomRef, { status: 'finished' });
                } catch (e) { console.error("Force end error: ", e); }
            };

            const quit = () => {
                setView('home');
                setRoomCode('');
                setMode(null);
                setLocalAnswers({});
            };

            // React render views
            if (!fb) {
                return (
                    <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center">
                        <div className="w-16 h-16 border-4 border-cyan-400 border-t-transparent rounded-full animate-spin shadow-[0_0_15px_#22d3ee] mb-4"></div>
                        <p className="text-cyan-400 font-extrabold tracking-widest text-lg uppercase animate-pulse">Neon Platforma Yuklanmoqda...</p>
                    </div>
                );
            }

            if (view === 'home') {
                return (
                    <div className="min-h-screen p-6 md:p-12">
                        <div className="max-w-6xl mx-auto">
                            <div className="text-center mb-16 animate-fade-in">
                                <h1 className="text-5xl md:text-8xl font-black mb-4 text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-pink-500 to-purple-500 [text-shadow:_0_0_40px_rgba(236,72,153,0.35)]">
                                    NEON FALSAFA
                                </h1>
                                <p className="text-xl text-cyan-200/60 font-medium tracking-[0.2em] uppercase">Jonli Multiplayer Jang Maydoni</p>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {GROUPS.map((group) => (
                                    <div 
                                        key={group.id}
                                        onClick={() => { setSelectedGroup(group); setView('setup'); }}
                                        className="bg-slate-900/40 backdrop-blur-md border border-cyan-500/20 p-6 rounded-2xl cursor-pointer transition-all duration-300 hover:scale-[1.03] hover:border-cyan-400 hover:shadow-[0_0_30px_rgba(34,211,238,0.25)] group"
                                    >
                                        <div className="text-cyan-400 mb-2 group-hover:text-pink-400 transition-colors">
                                            <span className="text-4xl font-black">{group.id + 1}</span>
                                            <span className="text-lg opacity-60 ml-2">Guruh</span>
                                        </div>
                                        <h3 className="text-xl font-bold text-slate-100 mb-2">{group.title}</h3>
                                        <p className="text-slate-400 text-sm flex items-center">
                                            <i data-lucide="check-circle" className="w-4 h-4 mr-2 text-cyan-400"></i>
                                            {group.description}
                                        </p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }

            if (view === 'setup') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6">
                        <div className="bg-slate-900/80 backdrop-blur-xl border border-pink-500/30 p-8 rounded-3xl w-full max-w-md shadow-[0_0_50px_rgba(236,72,153,0.15)]">
                            <button onClick={quit} className="text-slate-400 hover:text-cyan-400 mb-6 flex items-center transition-colors font-bold">
                                <i data-lucide="arrow-left" className="w-5 h-5 mr-2"></i> Ortga
                            </button>
                            
                            <h2 className="text-3xl font-black text-white mb-2">{selectedGroup.title}</h2>
                            <p className="text-cyan-400/80 mb-8">{selectedGroup.description}</p>

                            <div className="space-y-6">
                                <div>
                                    <label className="block text-sm font-bold text-slate-400 mb-2 uppercase tracking-wider">Jangchi Taxallusi (Ism)</label>
                                    <NeonInput value={playerName} onChange={e => setPlayerName(e.target.value)} placeholder="Ismingizni kiriting..." maxLength={15} />
                                </div>

                                <div className="grid grid-cols-2 gap-4 pt-4 border-t border-slate-800">
                                    <NeonButton onClick={startSolo} color="cyan" className="flex flex-col items-center justify-center py-6">
                                        <i data-lucide="user" className="w-8 h-8 mb-2"></i>
                                        <span>Yakka</span>
                                    </NeonButton>
                                    <NeonButton onClick={handleCreateRoom} color="pink" className="flex flex-col items-center justify-center py-6">
                                        <i data-lucide="users" className="w-8 h-8 mb-2"></i>
                                        <span>Guruh Yaratish</span>
                                    </NeonButton>
                                </div>

                                <div className="relative flex items-center py-4">
                                    <div className="flex-grow border-t border-slate-800"></div>
                                    <span className="flex-shrink-0 mx-4 text-slate-500 text-sm font-bold">YOKI</span>
                                    <div className="flex-grow border-t border-slate-800"></div>
                                </div>

                                <div className="flex space-x-2">
                                    <NeonInput value={joinCode} onChange={e => setJoinCode(e.target.value)} placeholder="Xona kodi (6 xonali)" maxLength={6} type="number" />
                                    <NeonButton onClick={handleJoinRoom} color="green" className="px-5">
                                        <i data-lucide="log-in" className="w-6 h-6"></i>
                                    </NeonButton>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            if (view === 'lobby') {
                const players = roomData?.players ? Object.values(roomData.players) : [];
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-6">
                        <div className="bg-slate-900/80 border border-cyan-500/50 p-8 rounded-3xl w-full max-w-lg text-center shadow-[0_0_30px_rgba(34,211,238,0.2)] animate-fade-in">
                            <h2 className="text-cyan-400 uppercase tracking-widest text-sm font-extrabold mb-2">GURUHGA QO'SHILISH KODI</h2>
                            <div className="text-6xl font-black text-white mb-8 tracking-[0.2em] neon-glow-cyan">
                                {roomCode}
                            </div>

                            <div className="bg-slate-950/50 rounded-xl p-4 mb-8 min-h-[200px] text-left">
                                <h3 className="text-slate-400 mb-4 flex items-center font-bold border-b border-slate-800 pb-2">
                                    <i data-lucide="users" className="w-5 h-5 mr-2 text-cyan-400 animate-pulse"></i> 
                                    Jangchilar ({players.length})
                                </h3>
                                <div className="flex flex-wrap gap-3">
                                    {players.map((p, i) => (
                                        <span key={i} className="bg-cyan-500/10 border border-cyan-500/30 text-cyan-300 px-4 py-2 rounded-full font-bold shadow-[0_0_10px_rgba(34,211,238,0.1)]">
                                            {p.name}
                                        </span>
                                    ))}
                                </div>
                            </div>

                            {isHost ? (
                                <NeonButton onClick={startGameMulti} color="green" className="w-full py-4 text-xl">
                                    <i data-lucide="play" className="w-6 h-6 mr-2"></i> BATTLE-NI BOSHLASH
                                </NeonButton>
                            ) : (
                                <p className="text-pink-500 animate-pulse text-lg tracking-widest uppercase font-extrabold">Host o'yinni boshlashini kuting...</p>
                            )}
                        </div>
                    </div>
                );
            }

            if (view === 'playing') {
                const question = selectedGroup.questions[currentQIndex];
                const myAnswer = mode === 'solo' ? localAnswers[currentQIndex] : roomData?.players[user?.uid]?.answers[currentQIndex];
                const hasAnswered = myAnswer !== undefined;
                
                const playersList = mode === 'multi' && roomData ? Object.values(roomData.players).sort((a,b) => b.score - a.score) : [];

                const timeColor = timeLeft > 10 ? 'bg-cyan-400 shadow-[0_0_10px_#22d3ee]' : 
                                  timeLeft > 5 ? 'bg-yellow-400 shadow-[0_0_10px_#facc15]' : 
                                  'bg-red-500 shadow-[0_0_10px_#ef4444] animate-pulse';

                return (
                    <div className="min-h-screen text-white p-4 md:p-8 flex flex-col lg:flex-row gap-6">
                        {/* Main Battle Room */}
                        <div className="flex-grow max-w-4xl mx-auto flex flex-col w-full">
                            <div className="flex justify-between items-end mb-6">
                                <div>
                                    <span className="text-pink-500 font-extrabold tracking-widest text-sm uppercase">{selectedGroup.title}</span>
                                    <h2 className="text-3xl font-black text-slate-100">Savol {currentQIndex + 1} / {selectedGroup.questions.length}</h2>
                                </div>
                                <div className="flex items-center gap-4">
                                    <div className="flex items-center text-3xl font-black">
                                        <i data-lucide="clock" className={`w-8 h-8 mr-2 ${timeLeft <= 5 ? 'text-red-500 animate-bounce' : 'text-cyan-400'}`}></i>
                                        <span className={timeLeft <= 5 ? 'text-red-500' : 'text-cyan-400'}>00:{timeLeft.toString().padStart(2, '0')}</span>
                                    </div>
                                    
                                    {isHost && mode === 'multi' && (
                                        <NeonButton onClick={handleEndGameEarly} color="red" className="py-2 px-4 text-sm font-bold">
                                            <i data-lucide="power" className="w-5 h-5 mr-1"></i> Tugatish
                                        </NeonButton>
                                    )}
                                </div>
                            </div>

                            {/* Neon Time bar */}
                            <div className="w-full h-3 bg-slate-900 rounded-full mb-8 overflow-hidden border border-slate-800">
                                <div 
                                    className={`h-full transition-all duration-1000 linear ${timeColor}`} 
                                    style={{ width: `${(timeLeft / 20) * 100}%` }}
                                ></div>
                            </div>

                            {/* Question Card with Glowing Borders */}
                            <div className="bg-slate-900/60 backdrop-blur-lg border border-slate-800 p-6 md:p-10 rounded-3xl shadow-[0_0_40px_rgba(0,0,0,0.6)] mb-8 flex-grow flex flex-col justify-center">
                                <h3 className="text-2xl md:text-3xl font-bold leading-relaxed mb-10 text-center text-slate-100">
                                    {question.text}
                                </h3>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-auto">
                                    {question.options.map((opt, idx) => {
                                        let btnStyle = "border-slate-800 bg-slate-900/40 text-slate-300 hover:border-cyan-400 hover:bg-slate-900/60";
                                        
                                        if (hasAnswered) {
                                            if (opt.isCorrect) {
                                                btnStyle = "border-green-400 bg-green-500/10 text-green-300 shadow-[0_0_15px_rgba(74,222,128,0.3)]";
                                            } else if (myAnswer === idx && !opt.isCorrect) {
                                                btnStyle = "border-red-500 bg-red-500/10 text-red-300 shadow-[0_0_15px_rgba(239,68,68,0.3)]";
                                            } else {
                                                btnStyle = "border-slate-950 bg-slate-950/60 text-slate-600 opacity-40";
                                            }
                                        }

                                        return (
                                            <button
                                                key={idx}
                                                onClick={() => mode === 'solo' ? handleAnswerSolo(idx) : handleAnswerMulti(idx)}
                                                disabled={hasAnswered}
                                                className={`p-5 rounded-2xl border-2 text-lg font-bold text-left transition-all duration-300 flex items-center ${btnStyle}`}
                                            >
                                                <span className="w-8 font-extrabold opacity-40 text-xl mr-2">{['A','B','C','D'][idx]}</span>
                                                <span className="flex-grow">{opt.text}</span>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                            
                            {mode === 'solo' && hasAnswered && (
                                 <div className="flex justify-end animate-fade-in">
                                     <NeonButton onClick={handleNextQuestionSolo} color="pink">
                                         Keyingisi <i data-lucide="arrow-right" className="w-5 h-5 ml-2"></i>
                                     </NeonButton>
                                 </div>
                            )}
                        </div>

                        {/* Sidebar Live Leaderboard */}
                        {mode === 'multi' && (
                            <div className="w-full lg:w-80 bg-slate-900/40 border border-pink-500/20 rounded-3xl p-6 flex flex-col h-full lg:max-h-[80vh]">
                                <h3 className="text-pink-400 font-extrabold tracking-widest uppercase mb-6 flex items-center border-b border-slate-800 pb-3">
                                    <i data-lucide="trophy" className="w-5 h-5 mr-2 text-pink-500 animate-bounce"></i> Live Reyting
                                </h3>
                                <div className="space-y-4 overflow-y-auto pr-2 custom-scrollbar flex-grow">
                                    {playersList.map((p, i) => {
                                        const isAnswered = p.answers && p.answers[currentQIndex] !== undefined;
                                        return (
                                            <div key={i} className={`p-4 rounded-xl flex justify-between items-center transition-all ${p.name === playerName ? 'bg-cyan-500/10 border border-cyan-500/40 shadow-[0_0_15px_rgba(34,211,238,0.1)]' : 'bg-slate-900/30'}`}>
                                                <div className="flex items-center">
                                                    <span className="w-6 h-6 rounded-full bg-slate-950 flex items-center justify-center text-xs font-black mr-3 text-cyan-400">
                                                        {i + 1}
                                                    </span>
                                                    <span className="font-bold truncate max-w-[100px]" title={p.name}>{p.name}</span>
                                                </div>
                                                <div className="flex flex-col items-end">
                                                    <div className="text-cyan-300 font-black text-sm">
                                                        {p.score} <span className="text-xs opacity-50 ml-1">PT</span>
                                                    </div>
                                                    {isAnswered && <span className="text-[10px] text-green-400 font-extrabold mt-1">Javob berdi ✓</span>}
                                                </div>
                                            </div>
                                        )
                                    })}
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            if (view === 'results') {
                let myScore = 0;
                let mistakes = [];
                
                if (mode === 'solo') {
                    selectedGroup.questions.forEach((q, i) => {
                        const myAnsIdx = localAnswers[i];
                        if (myAnsIdx !== undefined && q.options[myAnsIdx].isCorrect) {
                            myScore++;
                        } else {
                            mistakes.push({
                                qIndex: i,
                                text: q.text,
                                myAns: myAnsIdx !== undefined ? q.options[myAnsIdx].text : "Javob berilmagan",
                                correctAns: q.options.find(o => o.isCorrect).text
                            });
                        }
                    });
                } else if (mode === 'multi' && roomData) {
                    myScore = roomData.players[user.uid]?.score || 0;
                    const maxQuestionReached = roomData.currentQ;
                    
                    for (let i = 0; i <= maxQuestionReached; i++) {
                        const q = selectedGroup.questions[i];
                        const myAnsIdx = roomData.players[user.uid]?.answers[i];
                        if (myAnsIdx === undefined || !q.options[myAnsIdx].isCorrect) {
                            mistakes.push({
                                qIndex: i,
                                text: q.text,
                                myAns: myAnsIdx !== undefined ? q.options[myAnsIdx].text : "Javob berilmagan",
                                correctAns: q.options.find(o => o.isCorrect).text
                            });
                        }
                    }
                }

                const total = mode === 'multi' ? (roomData?.currentQ + 1 || 1) : selectedGroup.questions.length;
                const percentage = Math.round((myScore / total) * 100);

                const playersList = mode === 'multi' && roomData 
                    ? Object.values(roomData.players).sort((a,b) => b.score - a.score) 
                    : [];

                return (
                    <div className="min-h-screen p-6 md:p-12 overflow-y-auto">
                        <div className="max-w-5xl mx-auto">
                            
                            <div className="flex justify-between items-center mb-10 border-b border-slate-800 pb-6">
                                <h1 className="text-4xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-pink-500">BATTLE YAKUNI</h1>
                                <NeonButton onClick={quit} color="cyan">
                                    <i data-lucide="home" className="w-5 h-5 mr-2"></i> Bosh sahifa
                                </NeonButton>
                            </div>

                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                {/* Glowing Score Indicator */}
                                <div className="lg:col-span-1 bg-slate-900/60 border border-cyan-500/30 rounded-3xl p-8 text-center shadow-[0_0_30px_rgba(34,211,238,0.1)] flex flex-col items-center justify-center">
                                    <div className="w-44 h-44 rounded-full border-4 border-slate-800 flex items-center justify-center mb-6 relative">
                                        <svg className="absolute inset-0 w-full h-full -rotate-90">
                                            <circle cx="88" cy="88" r="82" className="stroke-slate-800 fill-none" strokeWidth="8" />
                                            <circle cx="88" cy="88" r="82" className="stroke-cyan-400 fill-none transition-all duration-1000" strokeWidth="8" strokeDasharray={2 * Math.PI * 82} strokeDashoffset={2 * Math.PI * 82 * (1 - (percentage || 0)/100)} />
                                        </svg>
                                        <div className="text-5xl font-black text-white">{percentage || 0}%</div>
                                    </div>
                                    <h2 className="text-2xl font-black mb-1">{playerName}</h2>
                                    <p className="text-slate-400 font-bold text-lg">{myScore} ta to'g'ri / {total} ta savoldan</p>
                                </div>

                                {/* Scoreboard */}
                                {mode === 'multi' && (
                                    <div className="lg:col-span-2 bg-slate-900/40 border border-pink-500/20 rounded-3xl p-8">
                                         <h3 className="text-2xl font-black text-pink-500 mb-6 flex items-center">
                                            <i data-lucide="crown" className="w-6 h-6 mr-3 text-yellow-500"></i> Yakuniy Reyting
                                        </h3>
                                        <div className="space-y-3">
                                            {playersList.map((p, i) => (
                                                <div key={i} className={`p-5 rounded-2xl flex justify-between items-center ${i === 0 ? 'bg-gradient-to-r from-yellow-500/10 to-transparent border border-yellow-500/40 shadow-[0_0_20px_rgba(234,179,8,0.1)]' : 'bg-slate-900/30'}`}>
                                                    <div className="flex items-center text-xl">
                                                        <span className={`w-9 h-9 rounded-full flex items-center justify-center font-black mr-4 ${i===0 ? 'bg-yellow-500 text-black shadow-[0_0_10px_#eab308]' : 'bg-slate-800 text-slate-300'}`}>
                                                            {i + 1}
                                                        </span>
                                                        <span className="font-extrabold">{p.name}</span>
                                                    </div>
                                                    <div className="text-2xl font-black text-cyan-400">
                                                        {p.score} <span className="text-sm font-bold text-slate-500">PT</span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>

                            {/* Detailed Review */}
                            {mistakes.length > 0 && (
                                <div className="mt-8 bg-slate-900/40 border border-slate-800 rounded-3xl p-6 md:p-10">
                                    <h3 className="text-2xl font-black text-red-400 mb-8 flex items-center">
                                        <i data-lucide="x-circle" className="w-6 h-6 mr-3 text-red-500 animate-pulse"></i> Xatolar tahlili ({mistakes.length} ta)
                                    </h3>
                                    <div className="space-y-6">
                                        {mistakes.map((m, i) => (
                                            <div key={i} className="bg-slate-950/60 p-6 rounded-2xl border-l-4 border-red-500">
                                                <p className="text-lg font-bold mb-4 text-slate-100">{m.text}</p>
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm font-bold">
                                                    <div className="bg-red-500/10 border border-red-500/20 p-4 rounded-xl text-red-300">
                                                        <span className="block text-red-500 text-xs font-black uppercase mb-1">Sizning javobingiz:</span>
                                                        {m.myAns}
                                                    </div>
                                                    <div className="bg-green-500/10 border border-green-500/20 p-4 rounded-xl text-green-300">
                                                        <span className="block text-green-500 text-xs font-black uppercase mb-1">To'g'ri javob:</span>
                                                        {m.correctAns}
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            return null;
        }

        // Initialize and Mount React
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);

        // Initialize Lucide Icons after React components updates
        setInterval(() => {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        }, 1000);
    </script>
</body>
</html>
